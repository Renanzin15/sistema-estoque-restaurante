<!DOCTYPE html>
<html lang="pt-br">
    <head>
        <meta charset="UTF-8">
        <title>Adcionar Produtos</title>
    </head>
    <body>
        <a href="/adicionar">Adicionar produto</a>
        <h1>Adicionar produtos ao estoque</h1>
        <a href="/">Voltar ao estoque</a>

        <form method="POST" action="/adicionar">
            <p>
                <label>Nome:</label>
                <input type="text" name="nome">
            </p>
            <p>
                <label>Categoria</label>
                <input type="text" name="categoria">
            </p>
            <p>
                <label>Quantidade</label>
                <input type="text" name="quantidade">
            </p>
            <p>
                <label>Unidade</label>
                <input type="text" name="unidade">
            </p>
            <p>
                <label>Preço</label>
                <input type="text" name="preco">
            </p>
            <button type="submit">Salvar produtos</button>
        </form>
    </body>
</html>
